name: Lint, Test & Release

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

permissions:
  contents: read

env:
  # the release tools follow the latest Node.js LTS, which can be newer than the node24 that the action runs on
  # (.nvmrc); the releasetools job checks them on the same version, and the release job waits for it
  RELEASE_NODE_VERSION: 'lts/*'

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm clean-install --ignore-scripts
      - name: Lint commit
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose
      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
  codelint:
    name: Lint code
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm clean-install --ignore-scripts
      - name: Lint code
        run: npm run lint
      - name: Type check
        # the tests run through node's type stripping and the build only checks src/, so check the types here
        run: npm run typecheck
  buildlint:
    name: Check built files
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm clean-install --ignore-scripts
      - name: Build files
        run: npm run build
      - name: Check built files
        # intent-to-add makes new untracked files show up in the diff, and no -w so whitespace changes count too
        run: |
          git add --intent-to-add --all
          if ! git diff --exit-code --stat; then
            echo "::error::The built files are out of date. Run npm run build and commit the changes to lib/ and README.md."
            exit 1
          fi
  releasetools:
    # the release job only runs on master, so check on every change that the release tools run on the release
    # Node version, and that a build there gives the same lib/ that semantic-release will commit
    name: Check release tools
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/release/package-lock.json
      - name: Install dependencies
        run: npm clean-install --ignore-scripts
      - name: Install the release tools
        run: npm clean-install --ignore-scripts --prefix tools/release
      - name: Check that semantic-release runs on this Node version
        # the semantic-release CLI exits with an error when the Node version doesn't meet its engines
        run: ./tools/release/node_modules/.bin/semantic-release --version
      - name: Build files
        run: npm run build
      - name: Check built files
        run: |
          git add --intent-to-add --all
          if ! git diff --exit-code --stat; then
            echo "::error::A build on the release Node version gives different files from the committed ones."
            exit 1
          fi
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs:
      - commitlint
      - codelint
      - buildlint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm clean-install --ignore-scripts
      - name: Run tests
        run: npm run test
  coverage:
    name: Test coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs:
      - commitlint
      - codelint
      - buildlint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install deps
        run: npm ci --ignore-scripts
      - name: Test code
        # keep a copy of the output for the summary; pipefail stops tee from hiding a test failure
        run: |
          set -o pipefail
          npm run test:coverage | tee "$RUNNER_TEMP/coverage.txt"
      - name: Report coverage
        if: ${{ !cancelled() }}
        # copy the coverage table that node prints between its start and end markers into the job summary
        run: |
          if [ ! -f "$RUNNER_TEMP/coverage.txt" ]; then
            exit 0
          fi
          {
            echo '# Code coverage'
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' "$RUNNER_TEMP/coverage.txt" | sed -e '1d' -e '$d' -e 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  runaction:
    needs:
      - commitlint
      - codelint
      - buildlint
      - test
    strategy:
      # let every job finish so a failure on one runner doesn't hide the outcome (and hardware) of the others
      fail-fast: false
      matrix:
        os: [ 'windows-2022', 'windows-2025' ]
        sqlserver: [ 'sql-latest', 'sql-2025', 'sql-2022', 'sql-2019', 'sql-2017', 'sql-2016' ]
        # the jobs above use the default inputs; each entry below sets its own variant, so it adds a separate job
        # that changes one input (quote the values: an unquoted false would fall back to the default below)
        variant: [ '' ]
        include:
          - os: windows-2025
            sqlserver: sql-2022
            variant: odbc-18
            odbc-version: '18'
          - os: windows-2025
            sqlserver: sql-latest
            variant: no-wait
            wait-for-ready: 'false'
          - os: windows-2022
            sqlserver: sql-2019
            variant: no-updates
            install-updates: 'false'
          # choosing the directories turns off the move away from a volume with large sectors, and checks the setup
          # switches that the move uses on every run, not only on the runners that need it
          - os: windows-2022
            sqlserver: sql-2022
            variant: custom-dirs
            install-arguments: |
              /INSTANCEDIR="D:\SQL Server"
              /INSTALLSQLDATADIR="D:\SQL Server"
            data-root: 'D:\SQL Server\'
          # a password that needs escaping on the setup command line: a space, characters that cmd.exe would treat
          # specially and a trailing backslash (setup can't pass on a double quote, so the action rejects one); the
          # check step logs in with it
          - os: windows-2022
            sqlserver: sql-2025
            variant: password
            sa-password: 'Str0ng Pa ss%^!\'
    name: runaction (${{ matrix.os }}, ${{ matrix.sqlserver }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # SQL Server can't start on a volume reporting a sector size over 4 KB, so record the runner's hardware to
      # compare against any setup failures
      - name: Log runner hardware
        continue-on-error: true
        shell: pwsh
        # write everything straight to the host so it isn't reordered around the output of fsutil
        run: |
          try {
            $vmSize = Invoke-RestMethod -Headers @{ Metadata = 'true' } -TimeoutSec 5 -Uri 'http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text'
          } catch {
            $vmSize = "unknown ($_)"
          }
          Write-Host "VM size: $vmSize"
          Write-Host "CPU: $((Get-CimInstance Win32_Processor).Name)"
          Get-PhysicalDisk | Format-Table -AutoSize FriendlyName, BusType, MediaType, LogicalSectorSize, PhysicalSectorSize | Out-Host
          $forced = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\stornvme\Parameters\Device' -ErrorAction SilentlyContinue).ForcedPhysicalSectorSizeInBytes
          Write-Host "ForcedPhysicalSectorSizeInBytes: $(if ($forced) { $forced } else { 'not set' })"
          foreach ($volume in Get-Volume | Where-Object { $_.DriveLetter -and $_.DriveType -eq 'Fixed' } | Sort-Object DriveLetter) {
            Write-Host "$($volume.DriveLetter):"
            fsutil fsinfo sectorinfo "$($volume.DriveLetter):"
          }
      - name: Install sql server
        id: install
        uses: ./
        with:
          sqlserver-version: ${{ matrix.sqlserver }}
          # the fallback is the action's own default, so the other jobs keep using it
          sa-password: ${{ matrix.sa-password || 'yourStrong(!)Password' }}
          native-client-version: 11
          odbc-version: ${{ matrix.odbc-version || '17' }}
          install-updates: ${{ matrix.install-updates || 'true' }}
          wait-for-ready: ${{ matrix.wait-for-ready || 'true' }}
          install-arguments: ${{ matrix.install-arguments || '' }}
      # the action only warns when the database isn't ready, so check that the instance it reports really works:
      # log in over TCP with its sa-password output and compare what the server reports with what was asked for
      - name: Check the installed instance
        shell: pwsh
        env:
          # sqlcmd reads the password from SQLCMDPASSWORD, so it stays off the command line
          SQLCMDPASSWORD: ${{ steps.install.outputs.sa-password }}
          INSTANCE_NAME: ${{ steps.install.outputs.instance-name }}
          SQLSERVER_VERSION: ${{ matrix.sqlserver }}
          ODBC_VERSION: ${{ matrix.odbc-version || '17' }}
          INSTALL_UPDATES: ${{ matrix.install-updates || 'true' }}
          DATA_ROOT: ${{ matrix.data-root || '' }}
        run: |
          # handle failures here instead of stopping at the first error, so every check reports
          $ErrorActionPreference = 'Continue'
          $failed = $false
          if ($env:INSTANCE_NAME -ne 'MSSQLSERVER') {
            Write-Host "::error::The instance-name output is '$env:INSTANCE_NAME', expected 'MSSQLSERVER'"
            $failed = $true
          }
          $query = "SET NOCOUNT ON; SELECT CAST(SERVERPROPERTY('ProductMajorVersion') AS nvarchar(128)), CAST(SERVERPROPERTY('ProductLevel') AS nvarchar(128)), ISNULL(CAST(SERVERPROPERTY('ProductUpdateLevel') AS nvarchar(128)), ''), CAST(SERVERPROPERTY('Collation') AS nvarchar(128)), CAST(SERVERPROPERTY('InstanceDefaultDataPath') AS nvarchar(260))"
          $row = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $output = sqlcmd -S 'tcp:127.0.0.1,1433' -U sa -b -l 5 -h -1 -W -s '|' -Q $query 2>&1
            if ($LASTEXITCODE -eq 0) {
              $row = $output | Where-Object { "$_" -match '\|' } | Select-Object -Last 1
              break
            }
            Write-Host "Login attempt $attempt over TCP failed: $output"
            Start-Sleep -Seconds 5
          }
          if (-not $row) {
            Write-Host "::error::Could not log in as sa over TCP with the sa-password output"
            exit 1
          }
          $major, $level, $updateLevel, $collation, $dataPath = "$row".Trim().Split('|')
          Write-Host "SQL Server major version $major, level $level, update level '$updateLevel', collation $collation, data path $dataPath"
          if ($env:DATA_ROOT -and -not $dataPath.StartsWith($env:DATA_ROOT, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Host "::error::SQL Server reports data path $dataPath, expected a path in $env:DATA_ROOT"
            $failed = $true
          }
          $expectedMajor = @{ 'sql-latest' = '17'; 'sql-2025' = '17'; 'sql-2022' = '16'; 'sql-2019' = '15'; 'sql-2017' = '14'; 'sql-2016' = '13' }[$env:SQLSERVER_VERSION]
          if ($major -ne $expectedMajor) {
            Write-Host "::error::SQL Server reports major version $major, expected $expectedMajor for $env:SQLSERVER_VERSION"
            $failed = $true
          }
          if ($collation -ne 'SQL_Latin1_General_CP1_CI_AS') {
            Write-Host "::error::SQL Server reports collation $collation, expected the default SQL_Latin1_General_CP1_CI_AS"
            $failed = $true
          }
          $driver = "ODBC Driver $env:ODBC_VERSION for SQL Server"
          if (-not (Test-Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\$driver")) {
            Write-Host "::error::$driver is not registered"
            $failed = $true
          }
          # only warn about the update level: a Microsoft download outage makes the action install without updates,
          # and that shouldn't fail unrelated changes. 2016 is updated with a service pack, the others with a CU.
          if ($major -eq '13') {
            $updated = $level -ne 'SP2'
          } else {
            $updated = $updateLevel -like 'CU*'
          }
          if ($env:INSTALL_UPDATES -eq 'true' -and -not $updated) {
            Write-Host "::warning::install-updates is true, but SQL Server reports level $level and update level '$updateLevel'"
          } elseif ($env:INSTALL_UPDATES -ne 'true' -and $updated) {
            Write-Host "::warning::install-updates is false, but SQL Server reports level $level and update level '$updateLevel'"
          }
          if ($failed) {
            exit 1
          }
      - name: Upload SQL Server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sqlserver-logs-${{ matrix.os }}-${{ matrix.sqlserver }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-${{ github.run_attempt }}
          path: |
            C:/Program Files/Microsoft SQL Server/*/Setup Bootstrap/Log/
            C:/Program Files/Microsoft SQL Server/MSSQL*/MSSQL/Log/
            D:/Microsoft SQL Server/MSSQL*/MSSQL/Log/
            D:/SQL Server/MSSQL*/MSSQL/Log/
          if-no-files-found: ignore
  release:
    name: Release
    concurrency: release
    if: ${{ github.repository_owner == 'tediousjs' && github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs:
      - commitlint
      - codelint
      - buildlint
      - releasetools
      - test
      - runaction
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/release/package-lock.json
      - name: Install dependencies
        # no install scripts, so no dependency code runs before the signatures are verified; semantic-release
        # still builds lib/ through the version and prepare scripts when it prepares a release
        run: npm clean-install --ignore-scripts
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Install the release tools
        # semantic-release and its plugins have their own lockfile, so development installs don't include them
        run: npm clean-install --ignore-scripts --prefix tools/release
      - name: Verify the registry signatures of the release tools
        run: npm audit signatures --prefix tools/release
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/release/node_modules/.bin/semantic-release
